name: Utilities
version: "0.1.0"
slug: utilities
description: Read-only utility bills, collections, and meter usage
url: https://github.com/jessfraz/ha-utilities
arch:
  - amd64
  - aarch64
image: ghcr.io/jessfraz/ha-utilities
startup: application
boot: auto
backup: cold
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:transmission-tower
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Bearer-authenticated API
environment:
  UTILITIES_ENABLE_INGRESS: "true"
options:
  config_file: /data/config.toml
schema:
  config_file: str
discovery:
  - utilities
