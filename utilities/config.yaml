name: Utilities
version: "0.1.2"
slug: utilities
description: Read-only utility bills, collections, and meter usage
url: https://github.com/jessfraz/ha-utilities
arch:
  - amd64
  - aarch64
image: ghcr.io/jessfraz/ha-utilities
startup: application
boot: auto
backup: cold
init: false
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:transmission-tower
ports:
  8080/tcp: null
ports_description:
  8080/tcp: Bearer-authenticated API
environment:
  UTILITIES_ENABLE_INGRESS: "true"
options:
  deployment: ""
  accounts: []
  wm_token: ""
  wm_client_id: ""
  bayou_api_key: ""
schema:
  deployment: str
  accounts:
    - id: str
      name: str
      deployment: str
      provider: list(waste_management|bayou)
      customer_id: str
      provider_account: str
      currency: str
      services:
        - id: str
          name: str
          provider_service: str
          kind: list(waste|recycling|electricity|gas|other)
  wm_token: password
  wm_client_id: password
  bayou_api_key: password
  config_file: str?
discovery:
  - utilities
