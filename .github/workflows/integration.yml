name: Integration
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    name: Publish integration and schema
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo run --locked --bin utilities -- --openapi dist/openapi.json
      - name: Package integration
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --python 3.14 python scripts/build-integration --output dist
          uv run --no-project --python 3.14 python - <<'PY'
          import hashlib, json, os, pathlib, tomllib
          root = pathlib.Path('custom_components/utilities')
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['TAG'] == f'v{version}'
          assert json.loads((root / 'manifest.json').read_text())['version'] == version
          files = [path for path in pathlib.Path('dist').iterdir() if path.is_file()]
          pathlib.Path('dist/SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(files)
          ))
          PY
      - name: Attach integration and generated schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --repo "$REPOSITORY"
